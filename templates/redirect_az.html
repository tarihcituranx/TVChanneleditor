<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xarici keçid xəbərdarlığı - TV kanalı redaktoru</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script>
      (function() {
        var state = localStorage.getItem(&#x27;theme-state&#x27;) || &#x27;auto&#x27;;
        var t = state;
        if (state === &#x27;auto&#x27;) {
            t = window.matchMedia(&#x27;(prefers-color-scheme: dark)&#x27;).matches ? &#x27;dark&#x27; : &#x27;light&#x27;;
        }
        if (t === &#x27;dark&#x27;) document.documentElement.setAttribute(&#x27;data-theme&#x27;, &#x27;dark&#x27;);
      })();
    </script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            font-family: &#x27;Inter&#x27;, system-ui, sans-serif;
        }
        .redirect-box {
            background: var(--card-bg);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 3rem;
            max-width: 500px;
            text-align: center;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }
        .redirect-box img.illustration {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: var(--radius-md);
            margin-bottom: 1.5rem;
        }
        .redirect-box h1 {
            color: var(--text-primary);
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        .redirect-box p {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .url-box {
            background: var(--bg-subtle);
            padding: 1rem;
            border-radius: var(--radius-md);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            word-break: break-all;
            margin-bottom: 2rem;
            font-family: monospace;
            font-size: 0.95rem;
            font-weight: 500;
        }
        .buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="redirect-box">
        <img src="/static/img/redirect_illustration.jpg" alt="Safe Redirect" class="illustration">
        <h1>Saytı Tərk Edirsiniz</h1>
        <p>TV Kanal Redaktoru tətbiqindən çıxırsınız. Linkə keçmək üçün aşağıdakı düyməni istifadə edin.</p>
        <div class="url-box" id="target-url">{{ url }}</div>
        <div class="buttons">
            <button onclick="window.history.back()" class="btn" style="background:var(--bg-subtle); color:var(--text-primary);">Geriyə Qayıt</button>
            <a href="{{ url }}" class="btn danger" style="text-decoration: none;">Bununla da davam et</a>
        </div>
    </div>
</body>
</html>
