{% extends "base_fr.html" %}

{% block title %}404 - Page Not Found | SCM Editor{% endblock %}

{% block content %}
<div class="card" style="text-align: center; padding: 5rem 2rem;">
    <div style="font-size: 6rem; line-height: 1; margin-bottom: 1rem; text-shadow: 0 0 20px rgba(59, 130, 246, 0.5);">
        📺
    </div>
    <h1 style="font-size: 4rem; margin-bottom: 0.5rem; color: var(--accent);">404</h1>
    <h2 style="font-size: 2rem; margin-bottom: 1rem;">No Signal!</h2>
    <p style="color: var(--text-secondary); font-size: 1.1rem; max-width: 500px; margin: 0 auto 2rem auto;">
        We couldn&#x27;t find the channel or page you&#x27;re looking for. Check your cables or return to the home page to start browsing again.
    </p>
    <a href="/" class="btn primary" style="display: inline-block; text-decoration: none; font-size: 1.1rem;">
        🏠 Return to Home Page
    </a>
</div>{% endblock %}
