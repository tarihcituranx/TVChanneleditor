openapi: 3.1.0
info:
  title: TV Channel Editor API
  version: 1.1.0
  summary: Smart TV channel list parsing and repacking API
  description: 'Parse, inspect, modify, and repack Smart TV channel list files.


    Supported brands include Samsung, LG, Sony, and Hisense.

    The API uses a session-based workflow:


    1. Upload a supported TV channel list file

    2. Read the returned `session_id`, `brand`, and `channels` array

    3. Modify the channel objects (e.g. change order, rename, set Fav/Lock)

    4. Send the `session_id` and modified `channels` array to `/build`

    5. Receive the rebuilt binary channel-list file

    '
  contact:
    name: Turan KAYA (Founder & Security Contact)
    url: https://github.com/tarihcituranx/TVChanneleditor
    email: tarihcituranx@proton.me
servers:
- url: https://tvchanneleditor.onrender.com
  description: Production Server
tags:
- name: Channel Lists
  description: Upload, parse, modify, and download channel lists
components:
  schemas:
    ErrorResponse:
      type: object
      required:
        - success
        - error
        - code
      properties:
        success:
          type: boolean
          example: false
        code:
          type: string
          example: FILE_NOT_FOUND
        error:
          type: string
          example: Dosya bulunamadı
    Channel:
      type: object
      description: >
        A single TV or radio channel. Fields are returned by /upload and accepted by /build.
        Samsung/Tizen files use PascalCase fields; LG/Sony/Hisense files are normalised to the
        same schema on the server side before being returned.
      required:
        - Name
      properties:
        "No":
          type: integer
          description: >
            Logical Channel Number (display position). The array order in the channels
            list is authoritative for ordering during /build. This field is informational
            and will be recalculated during export.
          minimum: 1
          example: 1
        Slot:
          type: integer
          description: >
            Internal hardware slot index. Required by the firmware for SCM/TLL formats.
            Do not modify unless you know what you are doing.
          example: 0
        Name:
          type: string
          description: Display name of the channel shown on the TV.
          maxLength: 40
          example: TRT 1 HD
        Type:
          type: string
          description: "Channel type: HD, SD, Radio, Data or empty."
          enum: [TV, HD, SD, Radio, Data, ""]
          example: HD
        Freq:
          type: string
          description: Satellite/transponder frequency in MHz.
          example: "11958"
        Pol:
          type: string
          description: Satellite polarization.
          enum: [V, H, ""]
          example: V
        Sym:
          type: string
          description: Symbol rate in ksps.
          example: "27500"
        Mod:
          type: string
          description: Modulation type (e.g. DVB-S2, 8PSK, QPSK). Present on Samsung SCM files.
          example: DVB-S2
        RollOff:
          type: string
          description: Roll-off factor. Present on Samsung SCM files.
          example: "0.35"
        Lock:
          type: boolean
          description: Whether the channel is PIN-locked.
          example: false
        Hide:
          type: boolean
          description: Whether the channel is hidden from the channel list on the TV.
          example: false
        Skip:
          type: boolean
          description: Whether the channel is skipped during up/down channel surfing.
          example: false
        Encrypted:
          type: string
          description: Whether the channel is encrypted (Pay TV / conditional access).
          enum: ["Yes", "No"]
          example: "No"
        Fav1:
          type: boolean
          description: Favourite list 1 membership.
          example: false
        Fav2:
          type: boolean
          description: Favourite list 2 membership.
          example: false
        Fav3:
          type: boolean
          description: Favourite list 3 membership.
          example: false
        Fav4:
          type: boolean
          description: Favourite list 4 membership.
          example: false
        Fav5:
          type: boolean
          description: Favourite list 5 membership.
          example: false
        SID:
          type: integer
          description: Service ID (DVB). Present in LG, Sony, Hisense files.
          example: 8280
        TSID:
          type: integer
          description: Transport Stream ID (DVB). Present in LG, Sony, Hisense files.
          example: 1071
        ONID:
          type: integer
          description: Original Network ID (DVB). Present in LG, Sony, Hisense files.
          example: 1
        VidPID:
          type: integer
          description: Video Elementary Stream PID. Present in Samsung SCM files.
          example: 1221
        AudPID:
          type: string
          description: Audio Elementary Stream PID(s). May be a single integer or a comma-separated list.
          example: "1222,1223"
        PcrPID:
          type: integer
          description: Program Clock Reference PID. Present in Samsung SCM files.
          example: 1221
    UploadResponse:
      type: object
      required:
      - success
      - brand
      - format
      - session_id
      - channels
      properties:
        success:
          type: boolean
          example: true
        brand:
          type: string
          description: Detected TV brand.
          enum:
          - samsung
          - lg
          - sony
          - hisense
          - unknown
          example: samsung
        original_filename:
          type: string
          description: The name of the original uploaded file, useful for identifying
            the TV model.
          example: lg_xxLA691S.tll
        format:
          type: string
          description: Detected internal file format.
          enum:
          - scm
          - zip
          - tll
          - sdb.xml
          - servicelist.db
          example: scm
        session_id:
          type: string
          description: Temporary session identifier returned after successful parsing.
            Pass this exact value to /build.
          example: sess_01J8ABC123XYZ
        channels:
          type: array
          description: Parsed channels in their current order.
          items:
            $ref: '#/components/schemas/Channel'
    DownloadRequest:
      type: object
      required:
      - session_id
      - channels
      properties:
        session_id:
          type: string
          description: Session ID returned by /upload.
          example: sess_01J8ABC123XYZ
        channels:
          type: array
          description: Modified channel list. The array order determines the resulting
            channel order.
          minItems: 1
          items:
            $ref: '#/components/schemas/Channel'
      example:
        session_id: sess_01J8ABC123XYZ
        channels:
        -         No: 1

          Slot: 0

          Name: TRT 1 HD

          Type: TV

          Freq: '11958'

          Pol: V

          Sym: '27500'

          Lock: false

          Hide: false

          Skip: false

          Encrypted: 'No'

          Fav1: false

          Fav2: false

          Fav3: false

          Fav4: false

          Fav5: false
paths:
  /upload:
    post:
      tags:
      - Channel Lists
      operationId: uploadChannelList
      summary: Upload and parse a TV channel list
      description: 'Upload a supported TV channel list file. The server detects the
        TV brand, parses the channels, and creates a temporary editing session.


        Supported formats by brand:

        - Samsung: .scm, .zip

        - LG: .tll

        - Sony: sdb.xml

        - Hisense: servicelist.db

        '
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: TV channel list file (.scm, .zip, .tll, .xml, .db)
      responses:
        '200':
          description: Channel list successfully parsed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
              examples:
                samsung_upload:
                  summary: Successful Samsung Parse
                  value:
                    success: true
                    brand: samsung
                    format: scm
                    session_id: sess_01J8ABC123XYZ
                    channels:
                    -                     No: 1

                      Slot: 0

                      Name: TRT 1 HD

                      Type: TV

                      Freq: '11958'

                      Pol: V

                      Sym: '27500'

                      Lock: false

                      Hide: false

                      Skip: false

                      Encrypted: 'No'

                      Fav1: false

                      Fav2: false

                      Fav3: false

                      Fav4: false

                      Fav5: false
        '400':
          description: Invalid, unsupported, or malformed channel list file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Uploaded file is too large (Max 2MB).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded (50 per hour or 10 per minute per IP)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /build:
    post:
      tags:
      - Channel Lists
      operationId: buildChannelList
      summary: Repack modified channel list
      description: 'Rebuild the channel-list file associated with a session. The returned
        JSON contains a `download_url` to fetch the binary file.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DownloadRequest'
      responses:
        '200':
          description: Rebuild successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  download_url:
                    type: string
                    example: /download/sess_123/channels.scm
        '400':
          description: Invalid request or expired session_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /download/{session_id}/{filename}:
    get:
      tags:
      - Channel Lists
      operationId: downloadBinaryFile
      summary: Download the rebuilt binary file
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
      - name: filename
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Rebuilt binary channel-list file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: File not found or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /health:
    get:
      tags:
      - System
      operationId: checkHealth
      summary: Health check endpoint
      description: Returns 200 OK if the API is running correctly. Used for UptimeRobot
        and Render Health Checks.
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: alive_and_breathing
                  pulse:
                    type: string
                    example: normal
                  message_en:
                    type: string
                  message_tr:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
  /api/version:
    get:
      tags:
      - System
      operationId: getApiVersion
      summary: Get current API version and deployment status
      description: Returns the semantic version, latest git commit hash, and the exact
        timestamp when the server was deployed/booted. Useful for cache-busting and
        deployment verification.
      responses:
        '200':
          description: Version info
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: online
                  version:
                    type: string
                    example: 1.0.0
                  commit:
                    type: string
                    description: The active Git commit hash running on the server.
                    example: 97401a523...
                  deployed_at:
                    type: string
                    format: date-time
                    description: Timestamp of when the server application booted.
                    example: 2026-08-18 19:00:51.123456+00:00

  /api/actions/delete-radios:
    post:
      tags:
      - Tools & Actions
      operationId: actionDeleteRadios
      summary: Remove all radio channels
      description: Returns the channel list with all radio (audio) channels removed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channels]
              properties:
                channels:
                  type: array
                  items:
                    $ref: '#/components/schemas/Channel'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  deleted:
                    type: integer
                  channels:
                    type: array
                    items:
                      $ref: '#/components/schemas/Channel'
  /api/actions/delete-encrypted:
    post:
      tags:
      - Tools & Actions
      operationId: actionDeleteEncrypted
      summary: Remove all encrypted channels
      description: Returns the channel list with all encrypted (Pay TV) channels removed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channels]
              properties:
                channels:
                  type: array
                  items:
                    $ref: '#/components/schemas/Channel'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  deleted:
                    type: integer
                  channels:
                    type: array
                    items:
                      $ref: '#/components/schemas/Channel'
  /api/actions/uppercase:
    post:
      tags:
      - Tools & Actions
      operationId: actionUppercase
      summary: Uppercase all channel names
      description: Returns the channel list with all channel names converted to UPPERCASE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channels]
              properties:
                channels:
                  type: array
                  items:
                    $ref: '#/components/schemas/Channel'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  channels:
                    type: array
                    items:
                      $ref: '#/components/schemas/Channel'
  /api/actions/sort-az:
    post:
      tags:
      - Tools & Actions
      operationId: actionSortAZ
      summary: Sort channels A-Z
      description: Returns the channel list alphabetically sorted by channel name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channels]
              properties:
                channels:
                  type: array
                  items:
                    $ref: '#/components/schemas/Channel'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  channels:
                    type: array
                    items:
                      $ref: '#/components/schemas/Channel'
  /api/actions/apply-template:
    post:
      tags:
      - Tools & Actions
      operationId: actionApplyTemplate
      summary: Apply a Smart Template
      description: Reorders the channels based on a predefined smart template (e.g. 'general', 'news', 'sports', 'movies', 'music', 'documentary', 'kids'). Unmatched channels are appended to the end.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channels, template]
              properties:
                template:
                  type: string
                  example: general
                  description: "Template ID (e.g., general, news, sports)"
                channels:
                  type: array
                  items:
                    $ref: '#/components/schemas/Channel'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  template_applied:
                    type: string
                  channels:
                    type: array
                    items:
                      $ref: '#/components/schemas/Channel'


  /api/satellites:
    get:
      tags:
      - Satellite & Frequencies
      operationId: getSatellites
      summary: List supported satellites
      description: Returns a list of supported countries, satellites, and their metadata (orbit, last updated date).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        country:
                          type: string
                          example: TURKIYE
                        country_code:
                          type: string
                          example: TR
                        satellite:
                          type: string
                          example: TURKSAT
                        name:
                          type: string
                          example: Türksat 3A/4A
                        orbit:
                          type: string
                          example: 42.0°E
                        last_updated:
                          type: string
                          format: date-time
                          example: "2026-08-25T00:00:00Z"
  /api/satellites/{country}/{satellite}:
    get:
      tags:
      - Satellite & Frequencies
      operationId: getFrequencies
      summary: Get frequency list
      description: Returns the detailed technical frequency data for a specific country and satellite.
      parameters:
      - name: country
        in: path
        required: true
        schema:
          type: string
          example: TURKIYE
      - name: satellite
        in: path
        required: true
        schema:
          type: string
          example: TURKSAT
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  country:
                    type: string
                  satellite:
                    type: string
                  last_updated:
                    type: string
                    format: date-time
                  total_channels:
                    type: integer
                  channels:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          example: TRT 1 HD
                        freq:
                          type: integer
                          example: 11305
                        mod:
                          type: string
                          example: DVB-S2
                        rolloff:
                          type: string
                          example: "0.20"
                        apid:
                          type: string
                          example: "266"
                        nid:
                          type: integer
                          example: 1070



  /api/actions/preview:
    post:
      tags:
      - Tools & Actions
      operationId: actionPreview
      summary: Channel list preview/statistics
      description: Returns statistical information (total, radio, HD, encrypted, etc.) for a given channel list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channels]
              properties:
                channels:
                  type: array
                  items:
                    $ref: '#/components/schemas/Channel'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  preview:
                    type: object
                    properties:
                      total:
                        type: integer
                      tv:
                        type: integer
                      radio:
                        type: integer
                      hd:
                        type: integer
                      sd:
                        type: integer
                      encrypted:
                        type: integer
                      locked:
                        type: integer
  /api/actions/diff:
    post:
      tags:
      - Tools & Actions
      operationId: actionDiff
      summary: Compare two channel lists
      description: Compares an old channel list with a new one and returns what was added, removed, or moved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_channels, new_channels]
              properties:
                old_channels:
                  type: array
                  items:
                    $ref: '#/components/schemas/Channel'
                new_channels:
                  type: array
                  items:
                    $ref: '#/components/schemas/Channel'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  diff:
                    type: object
                    properties:
                      added:
                        type: array
                        items:
                          type: object
                      removed:
                        type: array
                        items:
                          type: object
                      moved:
                        type: array
                        items:
                          type: object

  /api/validate:
    post:
      tags:
      - Tools & Actions
      operationId: validateChannels
      summary: Validate a channel list
      description: Validates an array of channels against the API schema rules. Returns a list of validation errors if any fields are invalid (e.g. wrong enums, wrong types).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channels]
              properties:
                channels:
                  type: array
                  items:
                    $ref: '#/components/schemas/Channel'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  valid:
                    type: boolean
                  total_errors:
                    type: integer
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        index:
                          type: integer
                        channel:
                          type: string
                        field:
                          type: string
                        message:
                          type: string

  /api/share:
    post:
      tags:
      - Cloud Sync
      operationId: createShareCode
      summary: Create a 8-character share code
      description: Save a channel list draft to the cloud and receive a unique 8-character
        code to share with other devices.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - draft
              properties:
                draft:
                  type: object
                  description: The current channel list and session data
      responses:
        '200':
          description: Share code created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  code:
                    type: string
                    example: X8VUJP
                  message:
                    type: string
        '400':
          description: Invalid data
        '429':
          description: Rate limit exceeded (20 per minute)
  /api/share/{code}:
    get:
      tags:
      - Cloud Sync
      operationId: getSharedList
      summary: Retrieve a shared channel list
      description: Fetch a previously saved channel list using its 8-character share
        code.
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
        description: The 8-character share code
      responses:
        '200':
          description: Channel list retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
        '404':
          description: Code invalid or expired
        '429':
          description: Rate limit exceeded (20 per minute)
