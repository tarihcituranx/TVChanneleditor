openapi: 3.0.3
info:
  title: TV Channel Editor API
  version: 1.0.0
  summary: Akıllı TV kanal listesini ayrıştırma ve yeniden paketleme API’si
  description: 'Akıllı TV kanal listesi dosyalarını ayrıştırın, inceleyin, değiştirin
    ve yeniden paketleyin.


    Desteklenen markalar arasında Samsung, LG, Sony ve Hisense bulunmaktadır.

    API, oturum tabanlı bir iş akışı kullanır:


    1. Desteklenen bir TV kanal listesi dosyasını yükleyin

    2. Geri döndürülen `session_id`, `brand` ve `channels` dizisini okuyun

    3. Kanal nesnelerini değiştirin (örn. sırayı değiştirin, yeniden adlandırın, Fav/Lock
    ayarlayın)

    4. `session_id` ve değiştirilmiş `channels` dizisini `/build` adresine gönderin

    5. Yeniden oluşturulmuş ikili kanal listesi dosyasını alın

    '
  contact:
    name: Turan KAYA (Founder & Security Contact)
    url: https://github.com/tarihcituranx/TVChanneleditor
    email: tarihcituranx@proton.me
servers:
- url: https://tvchanneleditor.onrender.com
  description: Üretim Sunucusu
tags:
- name: Channel Lists
  description: Kanal listelerini yükle, ayrıştır, değiştir ve indir
components:
  schemas:
    ErrorResponse:
      type: object
      required:
        - success
        - error
        - code
      properties:
        success:
          type: boolean
          example: false
        code:
          type: string
          example: FILE_NOT_FOUND
        error:
          type: string
          example: Dosya bulunamadı
    Channel:
      type: object
      description: >
        A single TV or radio channel. Fields are returned by /upload and accepted by /build.
        Samsung/Tizen files use PascalCase fields; LG/Sony/Hisense files are normalised to the
        same schema on the server side before being returned.
      required:
        - Name
      properties:
        "No":
          type: integer
          description: >
            Logical Channel Number (display position). The array order in the channels
            list is authoritative for ordering during /build. This field is informational
            and will be recalculated during export.
          minimum: 1
          example: 1
        Slot:
          type: integer
          description: >
            Internal hardware slot index. Required by the firmware for SCM/TLL formats.
            Do not modify unless you know what you are doing.
          example: 0
        Name:
          type: string
          description: Display name of the channel shown on the TV.
          maxLength: 40
          example: TRT 1 HD
        Type:
          type: string
          description: "Channel type: HD, SD, Radio, Data or empty."
          enum: [TV, HD, SD, Radio, Data, ""]
          example: HD
        Freq:
          type: string
          description: Satellite/transponder frequency in MHz.
          example: "11958"
        Pol:
          type: string
          description: Satellite polarization.
          enum: [V, H, ""]
          example: V
        Sym:
          type: string
          description: Symbol rate in ksps.
          example: "27500"
        Mod:
          type: string
          description: Modulation type (e.g. DVB-S2, 8PSK, QPSK). Present on Samsung SCM files.
          example: DVB-S2
        RollOff:
          type: string
          description: Roll-off factor. Present on Samsung SCM files.
          example: "0.35"
        Lock:
          type: boolean
          description: Whether the channel is PIN-locked.
          example: false
        Hide:
          type: boolean
          description: Whether the channel is hidden from the channel list on the TV.
          example: false
        Skip:
          type: boolean
          description: Whether the channel is skipped during up/down channel surfing.
          example: false
        Encrypted:
          type: string
          description: Whether the channel is encrypted (Pay TV / conditional access).
          enum: ["Yes", "No"]
          example: "No"
        Fav1:
          type: boolean
          description: Favourite list 1 membership.
          example: false
        Fav2:
          type: boolean
          description: Favourite list 2 membership.
          example: false
        Fav3:
          type: boolean
          description: Favourite list 3 membership.
          example: false
        Fav4:
          type: boolean
          description: Favourite list 4 membership.
          example: false
        Fav5:
          type: boolean
          description: Favourite list 5 membership.
          example: false
        SID:
          type: integer
          description: Service ID (DVB). Present in LG, Sony, Hisense files.
          example: 8280
        TSID:
          type: integer
          description: Transport Stream ID (DVB). Present in LG, Sony, Hisense files.
          example: 1071
        ONID:
          type: integer
          description: Original Network ID (DVB). Present in LG, Sony, Hisense files.
          example: 1
        VidPID:
          type: integer
          description: Video Elementary Stream PID. Present in Samsung SCM files.
          example: 1221
        AudPID:
          type: string
          description: Audio Elementary Stream PID(s). May be a single integer or a comma-separated list.
          example: "1222,1223"
        PcrPID:
          type: integer
          description: Program Clock Reference PID. Present in Samsung SCM files.
          example: 1221
    UploadResponse:
      type: object
      required:
      - success
      - brand
      - format
      - session_id
      - channels
      properties:
        success:
          type: boolean
          example: true
        brand:
          type: string
          description: Tespit edilen TV markası.
          enum:
          - samsung
          - lg
          - sony
          - hisense
          - unknown
          example: samsung
        original_filename:
          type: string
          description: Yüklenen orijinal dosyanın adı; TV modelini belirlemek için
            kullanışlıdır.
          example: lg_xxLA691S.tll
        format:
          type: string
          description: Dahili dosya biçimi algılandı.
          enum:
          - scm
          - zip
          - tll
          - sdb.xml
          - servicelist.db
          example: scm
        session_id:
          type: string
          description: Ayrıştırma işlemi başarıyla tamamlandıktan sonra geçici oturum
            tanımlayıcısı döndürüldü. Bu değeri aynen /download adresine aktarın.
          example: sess_01J8ABC123XYZ
        channels:
          type: array
          description: Kanallar mevcut sıralamalarına göre ayrıştırıldı.
          items:
            $ref: '#/components/schemas/Channel'
    DownloadRequest:
      type: object
      required:
      - session_id
      - channels
      properties:
        session_id:
          type: string
          description: /upload tarafından döndürülen oturum kimliği.
          example: sess_01J8ABC123XYZ
        channels:
          type: array
          description: Değiştirilmiş kanal listesi. Dizideki sıra, sonuçta ortaya
            çıkan kanal sırasını belirler.
          minItems: 1
          items:
            $ref: '#/components/schemas/Channel'
      example:
        session_id: sess_01J8ABC123XYZ
        channels:
        - false: 1
          No: 1

          Slot: 0

          Name: TRT 1 HD

          Type: TV

          Freq: '11958'

          Pol: V

          Sym: '27500'

          Lock: false

          Hide: false

          Skip: false

          Encrypted: 'No'

          Fav1: false

          Fav2: false

          Fav3: false

          Fav4: false

          Fav5: false
security:
- {}
- ApiKeyAuth: []
paths:
  /upload:
    post:
      tags:
      - Channel Lists
      operationId: uploadChannelList
      summary: Bir TV kanalı listesini yükle ve işleme al
      description: 'Desteklenen bir TV kanal listesi dosyasını yükleyin. Sunucu, TV
        markasını algılar, kanalları ayrıştırır ve geçici bir düzenleme oturumu oluşturur.


        Markalara göre desteklenen biçimler:

        - Samsung: .scm, .zip

        - LG: .tll

        - Sony: sdb.xml

        - Hisense: servicelist.db

        '
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: TV kanalları listesi dosyası (.scm, .zip, .tll, .xml,
                    .db)
      responses:
        '200':
          description: Kanal listesi başarıyla ayrıştırıldı.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
              examples:
                samsung_upload:
                  summary: Başarılı Samsung Parse
                  value:
                    success: true
                    brand: samsung
                    format: scm
                    session_id: sess_01J8ABC123XYZ
                    channels:
                    - false: 1
                      No: 1

                      Slot: 0

                      Name: TRT 1 HD

                      Type: TV

                      Freq: '11958'

                      Pol: V

                      Sym: '27500'

                      Lock: false

                      Hide: false

                      Skip: false

                      Encrypted: 'No'

                      Fav1: false

                      Fav2: false

                      Fav3: false

                      Fav4: false

                      Fav5: false
        '400':
          description: Geçersiz, desteklenmeyen veya biçim hatası içeren kanal listesi
            dosyası.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Yüklenen dosya çok büyük (En fazla 2 MB).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: İzin sınırı aşıldı (saatte 50)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /build:
    post:
      tags:
      - Channel Lists
      operationId: buildChannelList
      summary: Değiştirilmiş kanal listesini yeniden paketle
      description: 'Bir oturumla ilişkili kanal listesi dosyasını yeniden oluşturur.
        Döndürülen JSON, ikili dosyayı almak için bir `download_url` içerir.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DownloadRequest'
      responses:
        '200':
          description: Yeniden oluşturma işlemi başarıyla tamamlandı.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  download_url:
                    type: string
                    example: /download/sess_123/channels.scm
        '400':
          description: Geçersiz istek veya geçerlilik süresi dolmuş session_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: İstihdam sınırı aşıldı.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /download/{session_id}/{filename}:
    get:
      tags:
      - Channel Lists
      operationId: downloadBinaryFile
      summary: Yeniden derlenmiş ikili dosyayı indirin
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
      - name: filename
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: İkili kanal listesi dosyası yeniden oluşturuldu.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Dosya bulunamadı veya süresi doldu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /health:
    get:
      tags:
      - System
      operationId: checkHealth
      summary: Sağlık kontrolü son noktası
      description: API düzgün çalışıyorsa 200 OK yanıtı verir. UptimeRobot ve Render
        Sağlık Kontrollerinde kullanılır.
      responses:
        '200':
          description: Hizmet iyi durumda.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
  /api/version:
    get:
      tags:
      - System
      operationId: getApiVersion
      summary: Güncel API sürümünü ve dağıtım durumunu al
      description: Sunucunun dağıtıldığı/başlatıldığı zamana ait semantik sürümü,
        en son Git commit hash değerini ve tam zaman damgasını döndürür. Önbellek
        temizleme ve dağıtım doğrulaması için kullanışlıdır.
      responses:
        '200':
          description: Sürüm bilgileri
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: online
                  version:
                    type: string
                    example: 1.0.0
                  commit:
                    type: string
                    description: Sunucuda çalışan aktif Git commit hash'i.
                    example: 97401a523...
                  deployed_at:
                    type: string
                    format: date-time
                    description: Sunucu uygulamasının başlatıldığı zamanın zaman damgası.
                    example: 2026-08-18 19:00:51.123456+00:00

  /api/actions/delete-radios:
    post:
      tags:
      - Tools & Actions
      operationId: actionDeleteRadios
      summary: Remove all radio channels
      description: Returns the channel list with all radio (audio) channels removed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channels]
              properties:
                channels:
                  type: array
                  items:
                    $ref: '#/components/schemas/Channel'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  deleted:
                    type: integer
                  channels:
                    type: array
                    items:
                      $ref: '#/components/schemas/Channel'
  /api/actions/delete-encrypted:
    post:
      tags:
      - Tools & Actions
      operationId: actionDeleteEncrypted
      summary: Remove all encrypted channels
      description: Returns the channel list with all encrypted (Pay TV) channels removed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channels]
              properties:
                channels:
                  type: array
                  items:
                    $ref: '#/components/schemas/Channel'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  deleted:
                    type: integer
                  channels:
                    type: array
                    items:
                      $ref: '#/components/schemas/Channel'
  /api/actions/uppercase:
    post:
      tags:
      - Tools & Actions
      operationId: actionUppercase
      summary: Uppercase all channel names
      description: Returns the channel list with all channel names converted to UPPERCASE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channels]
              properties:
                channels:
                  type: array
                  items:
                    $ref: '#/components/schemas/Channel'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  channels:
                    type: array
                    items:
                      $ref: '#/components/schemas/Channel'
  /api/actions/sort-az:
    post:
      tags:
      - Tools & Actions
      operationId: actionSortAZ
      summary: Sort channels A-Z
      description: Returns the channel list alphabetically sorted by channel name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channels]
              properties:
                channels:
                  type: array
                  items:
                    $ref: '#/components/schemas/Channel'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  channels:
                    type: array
                    items:
                      $ref: '#/components/schemas/Channel'
  /api/actions/apply-template:
    post:
      tags:
      - Tools & Actions
      operationId: actionApplyTemplate
      summary: Apply a Smart Template
      description: Reorders the channels based on a predefined smart template (e.g. 'general', 'news', 'sports', 'movies', 'music', 'documentary', 'kids'). Unmatched channels are appended to the end.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channels, template]
              properties:
                template:
                  type: string
                  example: general
                  description: "Template ID (e.g., general, news, sports)"
                channels:
                  type: array
                  items:
                    $ref: '#/components/schemas/Channel'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  template_applied:
                    type: string
                  channels:
                    type: array
                    items:
                      $ref: '#/components/schemas/Channel'


  /api/satellites:
    get:
      tags:
      - Satellite & Frequencies
      operationId: getSatellites
      summary: List supported satellites
      description: Returns a list of supported countries, satellites, and their metadata (orbit, last updated date).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        country:
                          type: string
                          example: TURKIYE
                        country_code:
                          type: string
                          example: TR
                        satellite:
                          type: string
                          example: TURKSAT
                        name:
                          type: string
                          example: Türksat 3A/4A
                        orbit:
                          type: string
                          example: 42.0°E
                        last_updated:
                          type: string
                          format: date-time
                          example: "2026-08-25T00:00:00Z"
  /api/satellites/{country}/{satellite}:
    get:
      tags:
      - Satellite & Frequencies
      operationId: getFrequencies
      summary: Get frequency list
      description: Returns the detailed technical frequency data for a specific country and satellite.
      parameters:
      - name: country
        in: path
        required: true
        schema:
          type: string
          example: TURKIYE
      - name: satellite
        in: path
        required: true
        schema:
          type: string
          example: TURKSAT
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  country:
                    type: string
                  satellite:
                    type: string
                  last_updated:
                    type: string
                    format: date-time
                  total_channels:
                    type: integer
                  channels:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          example: TRT 1 HD
                        freq:
                          type: integer
                          example: 11305
                        mod:
                          type: string
                          example: DVB-S2
                        rolloff:
                          type: string
                          example: "0.20"
                        apid:
                          type: string
                          example: "266"
                        nid:
                          type: integer
                          example: 1070

  /api/share:
    post:
      tags:
      - Cloud Sync
      operationId: createShareCode
      summary: 8 haneli bir paylaşım kodu oluşturun
      description: Bir kanal listesi taslağını buluta kaydedin ve diğer cihazlarla
        paylaşmak üzere 8 karakterlik benzersiz bir kod alın. Paylaşılan listeler 60 dakika sonra otomatik olarak silinir.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - draft
              properties:
                draft:
                  type: object
                  description: Güncel kanal listesi ve oturum verileri
      responses:
        '200':
          description: Paylaşım kodu başarıyla oluşturuldu
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  code:
                    type: string
                    example: X8VUJP
                  message:
                    type: string
        '400':
          description: Geçersiz veri
        '429':
          description: İstihdam sınırı aşıldı (dakikada 20)
  /api/share/{code}:
    get:
      tags:
      - Cloud Sync
      operationId: getSharedList
      summary: Paylaşılan kanal listesini alma
      description: 8 karakterlik paylaşım kodunu kullanarak önceden kaydedilmiş bir
        kanal listesini getirin.
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
        description: 8 karakterlik paylaşım kodu
      responses:
        '200':
          description: Kanal listesi başarıyla alındı
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
        '404':
          description: Kod geçersiz veya süresi dolmuş
        '429':
          description: İstikrar sınırı aşıldı (dakikada 20)
