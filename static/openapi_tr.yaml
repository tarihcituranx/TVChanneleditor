openapi: 3.0.3
info:
  title: TV Channel Editor API
  version: 1.0.0
  summary: Akıllı TV kanal listesini ayrıştırma ve yeniden paketleme API’si
  description: 'Akıllı TV kanal listesi dosyalarını ayrıştırın, inceleyin, değiştirin
    ve yeniden paketleyin.


    Desteklenen markalar arasında Samsung, LG, Sony ve Hisense bulunmaktadır.

    API, oturum tabanlı bir iş akışı kullanır:


    1. Desteklenen bir TV kanal listesi dosyasını yükleyin

    2. Geri döndürülen `session_id`, `brand` ve `channels` dizisini okuyun

    3. Kanal nesnelerini değiştirin (örn. sırayı değiştirin, yeniden adlandırın, Fav/Lock
    ayarlayın)

    4. `session_id` ve değiştirilmiş `channels` dizisini `/download` adresine gönderin

    5. Yeniden oluşturulmuş ikili kanal listesi dosyasını alın

    '
  contact:
    name: Turan KAYA (Founder & Security Contact)
    url: https://github.com/tarihcituranx/TVChanneleditor
    email: tarihcituranx@proton.me
servers:
- url: https://tvchanneleditor.onrender.com
  description: Üretim Sunucusu
tags:
- name: Channel Lists
  description: Kanal listelerini yükle, ayrıştır, değiştir ve indir
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'Standart 50 istek/saat IP hız sınırını aşmak için isteğe bağlı
        API anahtarı.

        Anahtar olmadan, uç nokta hız sınırına kadar normal şekilde çalışır.

        '
  schemas:
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          example: Dosya bulunamadı
    Channel:
      type: object
      description: Tek bir televizyon veya radyo kanalı.
      required:
      - false
      - Name
      properties:
        false:
          type: integer
          description: 'Mevcut konum/Mantıksal Kanal Numarası.

            Not: İndirme sırasında kanal sıralaması açısından dizi sırası belirleyicidir.

            Bu “Hayır” alanı bilgilendirme amaçlıdır ve dışa aktarım sırasında yeniden
            hesaplanabilir.

            '
          minimum: 1
          example: 1
        Name:
          type: string
          description: Kanalın görüntü adı.
          example: TRT 1 HD
        Type:
          type: string
          description: Kanal türü (örn. TV, Radyo, Veri).
          example: TV
        Freq:
          type: string
          description: Uydu/transponder frekansı (MHz cinsinden).
          example: '11958'
        Pol:
          type: string
          description: Uydu polarizasyonu (V veya H).
          example: V
        Sym:
          type: string
          description: Sembol hızı.
          example: '27500'
        Fav:
          type: string
          description: Kanalın favorilere eklenip eklenmediği.
          enum:
          - 'Yes'
          - 'No'
          example: 'No'
        Lock:
          type: string
          description: Kanalın PIN kodu ile kilitli olup olmadığı.
          enum:
          - 'Yes'
          - 'No'
          example: 'No'
        Encrypted:
          type: string
          description: Kanalın şifreli olup olmadığı (Ücretli TV).
          enum:
          - 'Yes'
          - 'No'
          example: 'No'
    UploadResponse:
      type: object
      required:
      - success
      - brand
      - format
      - session_id
      - channels
      properties:
        success:
          type: boolean
          example: true
        brand:
          type: string
          description: Tespit edilen TV markası.
          enum:
          - samsung
          - lg
          - sony
          - hisense
          - unknown
          example: samsung
        original_filename:
          type: string
          description: Yüklenen orijinal dosyanın adı; TV modelini belirlemek için
            kullanışlıdır.
          example: lg_xxLA691S.tll
        format:
          type: string
          description: Dahili dosya biçimi algılandı.
          enum:
          - scm
          - zip
          - tll
          - sdb.xml
          - servicelist.db
          example: scm
        session_id:
          type: string
          description: Ayrıştırma işlemi başarıyla tamamlandıktan sonra geçici oturum
            tanımlayıcısı döndürüldü. Bu değeri aynen /download adresine aktarın.
          example: sess_01J8ABC123XYZ
        channels:
          type: array
          description: Kanallar mevcut sıralamalarına göre ayrıştırıldı.
          items:
            $ref: '#/components/schemas/Channel'
    DownloadRequest:
      type: object
      required:
      - session_id
      - channels
      properties:
        session_id:
          type: string
          description: /upload tarafından döndürülen oturum kimliği.
          example: sess_01J8ABC123XYZ
        channels:
          type: array
          description: Değiştirilmiş kanal listesi. Dizideki sıra, sonuçta ortaya
            çıkan kanal sırasını belirler.
          minItems: 1
          items:
            $ref: '#/components/schemas/Channel'
      example:
        session_id: sess_01J8ABC123XYZ
        channels:
        - false: 1
          Name: TRT 1 HD
          Type: TV
          Freq: '11958'
          Pol: V
          Sym: '27500'
          Fav: 'Yes'
          Lock: 'No'
          Encrypted: 'No'
security:
- {}
- ApiKeyAuth: []
paths:
  /upload:
    post:
      tags:
      - Channel Lists
      operationId: uploadChannelList
      summary: Bir TV kanalı listesini yükle ve işleme al
      description: 'Desteklenen bir TV kanal listesi dosyasını yükleyin. Sunucu, TV
        markasını algılar, kanalları ayrıştırır ve geçici bir düzenleme oturumu oluşturur.


        Markalara göre desteklenen biçimler:

        - Samsung: .scm, .zip

        - LG: .tll

        - Sony: sdb.xml

        - Hisense: servicelist.db

        '
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: TV kanalları listesi dosyası (.scm, .zip, .tll, .xml,
                    .db)
      responses:
        '200':
          description: Kanal listesi başarıyla ayrıştırıldı.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
              examples:
                samsung_upload:
                  summary: Başarılı Samsung Parse
                  value:
                    success: true
                    brand: samsung
                    format: scm
                    session_id: sess_01J8ABC123XYZ
                    channels:
                    - false: 1
                      Name: TRT 1 HD
                      Type: TV
                      Freq: '11958'
                      Pol: V
                      Sym: '27500'
                      Fav: 'Yes'
                      Lock: 'No'
                      Encrypted: 'No'
        '400':
          description: Geçersiz, desteklenmeyen veya biçim hatası içeren kanal listesi
            dosyası.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Yüklenen dosya çok büyük (En fazla 2 MB).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: İzin sınırı aşıldı (saatte 50). Bu sınırı aşmak için X-API-Key'i
            kullanın.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /build:
    post:
      tags:
      - Channel Lists
      operationId: buildChannelList
      summary: Değiştirilmiş kanal listesini yeniden paketle
      description: 'Bir oturumla ilişkili kanal listesi dosyasını yeniden oluşturur.
        Döndürülen JSON, ikili dosyayı almak için bir `download_url` içerir.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DownloadRequest'
      responses:
        '200':
          description: Yeniden oluşturma işlemi başarıyla tamamlandı.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  download_url:
                    type: string
                    example: /download/sess_123/channels.scm
        '400':
          description: Geçersiz istek veya geçerlilik süresi dolmuş session_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: İstihdam sınırı aşıldı.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /download/{session_id}/{filename}:
    get:
      tags:
      - Channel Lists
      operationId: downloadBinaryFile
      summary: Yeniden derlenmiş ikili dosyayı indirin
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
      - name: filename
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: İkili kanal listesi dosyası yeniden oluşturuldu.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Dosya bulunamadı veya süresi doldu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /health:
    get:
      tags:
      - System
      operationId: checkHealth
      summary: Sağlık kontrolü son noktası
      description: API düzgün çalışıyorsa 200 OK yanıtı verir. UptimeRobot ve Render
        Sağlık Kontrollerinde kullanılır.
      responses:
        '200':
          description: Hizmet iyi durumda.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
  /api/version:
    get:
      tags:
      - System
      operationId: getApiVersion
      summary: Güncel API sürümünü ve dağıtım durumunu al
      description: Sunucunun dağıtıldığı/başlatıldığı zamana ait semantik sürümü,
        en son Git commit hash değerini ve tam zaman damgasını döndürür. Önbellek
        temizleme ve dağıtım doğrulaması için kullanışlıdır.
      responses:
        '200':
          description: Sürüm bilgileri
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: online
                  version:
                    type: string
                    example: 1.0.0
                  commit:
                    type: string
                    description: Sunucuda çalışan aktif Git commit hash'i.
                    example: 97401a523...
                  deployed_at:
                    type: string
                    format: date-time
                    description: Sunucu uygulamasının başlatıldığı zamanın zaman damgası.
                    example: 2026-08-18 19:00:51.123456+00:00
  /api/share:
    post:
      tags:
      - Cloud Sync
      operationId: createShareCode
      summary: 6 haneli bir paylaşım kodu oluşturun
      description: Bir kanal listesi taslağını buluta kaydedin ve diğer cihazlarla
        paylaşmak üzere 6 karakterlik benzersiz bir kod alın.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - draft
              properties:
                draft:
                  type: object
                  description: Güncel kanal listesi ve oturum verileri
      responses:
        '200':
          description: Paylaşım kodu başarıyla oluşturuldu
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  code:
                    type: string
                    example: X8VUJP
                  message:
                    type: string
        '400':
          description: Geçersiz veri
        '429':
          description: İstihdam sınırı aşıldı (dakikada 20)
  /api/share/{code}:
    get:
      tags:
      - Cloud Sync
      operationId: getSharedList
      summary: Paylaşılan kanal listesini alma
      description: 6 karakterlik paylaşım kodunu kullanarak önceden kaydedilmiş bir
        kanal listesini getirin.
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
        description: 6 karakterlik paylaşım kodu
      responses:
        '200':
          description: Kanal listesi başarıyla alındı
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
        '404':
          description: Kod geçersiz veya süresi dolmuş
        '429':
          description: İstikrar sınırı aşıldı (dakikada 20)
