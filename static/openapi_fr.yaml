openapi: 3.0.3
info:
  title: TV Channel Editor API
  version: 1.0.0
  summary: Smart TV channel list parsing and repacking API
  description: 'Parse, inspect, modify, and repack Smart TV channel list files.


    Supported brands include Samsung, LG, Sony, and Hisense.

    The API uses a session-based workflow:


    1. Upload a supported TV channel list file

    2. Read the returned `session_id`, `brand`, and `channels` array

    3. Modify the channel objects (e.g. change order, rename, set Fav/Lock)

    4. Send the `session_id` and modified `channels` array to `/download`

    5. Receive the rebuilt binary channel-list file

    '
  contact:
    name: Turan KAYA (Founder & Security Contact)
    url: https://github.com/tarihcituranx/TVChanneleditor
    email: tarihcituranx@proton.me
servers:
- url: https://tvchanneleditor.onrender.com
  description: Production Server
tags:
- name: Channel Lists
  description: Upload, parse, modify, and download channel lists
components:
  schemas:
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          example: Dosya bulunamadı
    Channel:
      type: object
      description: 'A single TV or radio channel. Fields are returned by `/upload`
        and accepted by `/build`. Samsung/Tizen files use PascalCase fields; LG/Sony/Hisense
        files are normalised to the same schema on the server side before being returned.

        '
      required:
      - Name
      properties:
        false:
          type: integer
          description: 'Logical Channel Number (display position). The **array order**
            in the `channels` list is authoritative for ordering during `/build`.
            This field is informational and will be recalculated during export.

            '
          minimum: 1
          example: 1
        Slot:
          type: integer
          description: 'Internal hardware slot index. Required by the firmware for
            SCM/TLL formats. Do not modify unless you know what you are doing.

            '
          example: 0
        Name:
          type: string
          description: Display name of the channel shown on the TV.
          maxLength: 40
          example: TRT 1 HD
        Type:
          type: string
          description: Channel type. `HD` indicates an HD channel, `SD` standard definition,
            `Radio` for audio-only.
          enum:
          - TV
          - HD
          - SD
          - Radio
          - Data
          - ''
          example: HD
        Freq:
          type: string
          description: Satellite/transponder frequency in MHz.
          example: '11958'
        Pol:
          type: string
          description: Satellite polarization.
          enum:
          - V
          - H
          - ''
          example: V
        Sym:
          type: string
          description: Symbol rate in ksps.
          example: '27500'
        Mod:
          type: string
          description: Modulation type (e.g. DVB-S2, 8PSK, QPSK). Present on Samsung
            SCM files.
          example: DVB-S2
        RollOff:
          type: string
          description: Roll-off factor. Present on Samsung SCM files.
          example: '0.35'
        Lock:
          type: boolean
          description: Whether the channel is PIN-locked.
          example: false
        Hide:
          type: boolean
          description: Whether the channel is hidden from the channel list on the
            TV.
          example: false
        Skip:
          type: boolean
          description: Whether the channel is skipped during up/down channel surfing.
          example: false
        Encrypted:
          type: string
          description: Whether the channel is encrypted (Pay TV / conditional access).
          enum:
          - 'Yes'
          - 'No'
          example: 'No'
        Fav1:
          type: boolean
          description: Favourite list 1 membership.
          example: false
        Fav2:
          type: boolean
          description: Favourite list 2 membership.
          example: false
        Fav3:
          type: boolean
          description: Favourite list 3 membership.
          example: false
        Fav4:
          type: boolean
          description: Favourite list 4 membership.
          example: false
        Fav5:
          type: boolean
          description: Favourite list 5 membership.
          example: false
        SID:
          type: integer
          description: Service ID (DVB). Present in LG, Sony, Hisense files.
          example: 8280
        TSID:
          type: integer
          description: Transport Stream ID (DVB). Present in LG, Sony, Hisense files.
          example: 1071
        ONID:
          type: integer
          description: Original Network ID (DVB). Present in LG, Sony, Hisense files.
          example: 1
        VidPID:
          type: integer
          description: Video Elementary Stream PID. Present in Samsung SCM files.
          example: 1221
        AudPID:
          type: string
          description: 'Audio Elementary Stream PID(s). May be a single integer or
            a comma-separated list when multiple audio tracks exist.

            '
          example: 1222,1223
        PcrPID:
          type: integer
          description: Program Clock Reference PID. Present in Samsung SCM files.
          example: 1221
    UploadResponse:
      type: object
      required:
      - success
      - brand
      - format
      - session_id
      - channels
      properties:
        success:
          type: boolean
          example: true
        brand:
          type: string
          description: Detected TV brand.
          enum:
          - samsung
          - lg
          - sony
          - hisense
          - unknown
          example: samsung
        original_filename:
          type: string
          description: The name of the original uploaded file, useful for identifying
            the TV model.
          example: lg_xxLA691S.tll
        format:
          type: string
          description: Detected internal file format.
          enum:
          - scm
          - zip
          - tll
          - sdb.xml
          - servicelist.db
          example: scm
        session_id:
          type: string
          description: Temporary session identifier returned after successful parsing.
            Pass this exact value to /download.
          example: sess_01J8ABC123XYZ
        channels:
          type: array
          description: Parsed channels in their current order.
          items:
            $ref: '#/components/schemas/Channel'
    DownloadRequest:
      type: object
      required:
      - session_id
      - channels
      properties:
        session_id:
          type: string
          description: Session ID returned by /upload.
          example: sess_01J8ABC123XYZ
        channels:
          type: array
          description: Modified channel list. The array order determines the resulting
            channel order.
          minItems: 1
          items:
            $ref: '#/components/schemas/Channel'
      example:
        session_id: sess_01J8ABC123XYZ
        channels:
        - false: 1
          Name: TRT 1 HD
          Type: TV
          Freq: '11958'
          Pol: V
          Sym: '27500'
          Fav: 'Yes'
          Lock: 'No'
          Encrypted: 'No'
security:
- {}
- ApiKeyAuth: []
paths:
  /upload:
    post:
      tags:
      - Channel Lists
      operationId: uploadChannelList
      summary: Upload and parse a TV channel list
      description: 'Upload a supported TV channel list file. The server detects the
        TV brand, parses the channels, and creates a temporary editing session.


        Supported formats by brand:

        - Samsung: .scm, .zip

        - LG: .tll

        - Sony: sdb.xml

        - Hisense: servicelist.db

        '
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: TV channel list file (.scm, .zip, .tll, .xml, .db)
      responses:
        '200':
          description: Channel list successfully parsed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
              examples:
                samsung_upload:
                  summary: Successful Samsung Parse
                  value:
                    success: true
                    brand: samsung
                    format: scm
                    session_id: sess_01J8ABC123XYZ
                    channels:
                    - false: 1
                      Name: TRT 1 HD
                      Type: TV
                      Freq: '11958'
                      Pol: V
                      Sym: '27500'
                      Fav: 'Yes'
                      Lock: 'No'
                      Encrypted: 'No'
        '400':
          description: Invalid, unsupported, or malformed channel list file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Uploaded file is too large (Max 2MB).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded (50 per hour)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /build:
    post:
      tags:
      - Channel Lists
      operationId: buildChannelList
      summary: Repack modified channel list
      description: 'Rebuild the channel-list file associated with a session. The returned
        JSON contains a `download_url` to fetch the binary file.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DownloadRequest'
      responses:
        '200':
          description: Rebuild successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  download_url:
                    type: string
                    example: /download/sess_123/channels.scm
        '400':
          description: Invalid request or expired session_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /download/{session_id}/{filename}:
    get:
      tags:
      - Channel Lists
      operationId: downloadBinaryFile
      summary: Download the rebuilt binary file
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
      - name: filename
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Rebuilt binary channel-list file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: File not found or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /health:
    get:
      tags:
      - System
      operationId: checkHealth
      summary: Health check endpoint
      description: Returns 200 OK if the API is running correctly. Used for UptimeRobot
        and Render Health Checks.
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
  /api/version:
    get:
      tags:
      - System
      operationId: getApiVersion
      summary: Get current API version and deployment status
      description: Returns the semantic version, latest git commit hash, and the exact
        timestamp when the server was deployed/booted. Useful for cache-busting and
        deployment verification.
      responses:
        '200':
          description: Version info
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: online
                  version:
                    type: string
                    example: 1.0.0
                  commit:
                    type: string
                    description: The active Git commit hash running on the server.
                    example: 97401a523...
                  deployed_at:
                    type: string
                    format: date-time
                    description: Timestamp of when the server application booted.
                    example: 2026-08-18 19:00:51.123456+00:00
  /api/share:
    post:
      tags:
      - Cloud Sync
      operationId: createShareCode
      summary: Create a 8-character share code
      description: Save a channel list draft to the cloud and receive a unique 8-character
        code to share with other devices.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - draft
              properties:
                draft:
                  type: object
                  description: The current channel list and session data
      responses:
        '200':
          description: Share code created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  code:
                    type: string
                    example: X8VUJP
                  message:
                    type: string
        '400':
          description: Invalid data
        '429':
          description: Rate limit exceeded (20 per minute)
  /api/share/{code}:
    get:
      tags:
      - Cloud Sync
      operationId: getSharedList
      summary: Retrieve a shared channel list
      description: Fetch a previously saved channel list using its 8-character share
        code.
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
        description: The 8-character share code
      responses:
        '200':
          description: Channel list retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
        '404':
          description: Code invalid or expired
        '429':
          description: Rate limit exceeded (20 per minute)
