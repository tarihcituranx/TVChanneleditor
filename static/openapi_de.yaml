openapi: 3.0.3
info:
  title: TV Channel Editor API
  version: 1.0.0
  summary: API zum Analysieren und Neuverpacken von Smart-TV-Senderlisten
  description: 'Smart-TV-Senderlisten-Dateien analysieren, prüfen, ändern und neu
    verpacken.


    Zu den unterstützten Marken gehören Samsung, LG, Sony und Hisense.

    Die API nutzt einen sitzungsbasierten Arbeitsablauf:


    1. Eine unterstützte TV-Senderlisten-Datei hochladen

    2. Die zurückgegebenen Werte `session_id`, `brand` und das Array `channels` auslesen

    3. Ändern Sie die Kanalobjekte (z. B. Reihenfolge ändern, umbenennen, als Favorit
    markieren/sperren)

    4. Senden Sie die `session_id` und das geänderte `channels`-Array an `/download`

    5. Empfangen Sie die neu erstellte binäre Kanal-Listendatei

    '
  contact:
    name: Turan KAYA (Founder & Security Contact)
    url: https://github.com/tarihcituranx/TVChanneleditor
    email: tarihcituranx@proton.me
servers:
- url: https://tvchanneleditor.onrender.com
  description: Production Server
tags:
- name: Channel Lists
  description: Kanallisten hochladen, analysieren, bearbeiten und herunterladen
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'Optionaler API-Schlüssel zur Umgehung der standardmäßigen IP-Ratenbegrenzung
        von 50 Anfragen pro Stunde.

        Ohne Schlüssel funktioniert der Endpunkt bis zum Erreichen der Ratenbegrenzung
        wie gewohnt.

        '
  schemas:
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          example: Dosya bulunamadı
    Channel:
      type: object
      description: Ein einzelner Fernseh- oder Radiosender.
      required:
      - false
      - Name
      properties:
        false:
          type: integer
          description: 'Aktuelle Position/Logische Kanalnummer.

            Hinweis: Die Reihenfolge im Array ist maßgeblich für die Kanalreihenfolge
            beim Herunterladen.

            Dieses Feld „Nein“ dient nur zu Informationszwecken und kann beim Export
            neu berechnet werden.

            '
          minimum: 1
          example: 1
        Name:
          type: string
          description: Anzeigename des Kanals.
          example: TRT 1 HD
        Type:
          type: string
          description: Kanaltyp (z. B. Fernsehen, Radio, Daten).
          example: TV
        Freq:
          type: string
          description: Satelliten-/Transponderfrequenz in MHz.
          example: '11958'
        Pol:
          type: string
          description: Satellitenpolarisation (V oder H).
          example: V
        Sym:
          type: string
          description: Symbolrate.
          example: '27500'
        Fav:
          type: string
          description: Ob der Kanal als Favorit markiert ist.
          enum:
          - 'Yes'
          - 'No'
          example: 'No'
        Lock:
          type: string
          description: Ob der Kanal mit einer PIN gesperrt ist.
          enum:
          - 'Yes'
          - 'No'
          example: 'No'
        Encrypted:
          type: string
          description: Ob der Sender verschlüsselt ist (Bezahlfernsehen).
          enum:
          - 'Yes'
          - 'No'
          example: 'No'
    UploadResponse:
      type: object
      required:
      - success
      - brand
      - format
      - session_id
      - channels
      properties:
        success:
          type: boolean
          example: true
        brand:
          type: string
          description: Erkannte TV-Marke.
          enum:
          - samsung
          - lg
          - sony
          - hisense
          - unknown
          example: samsung
        original_filename:
          type: string
          description: Der Name der ursprünglich hochgeladenen Datei; hilfreich zur
            Identifizierung des TV-Modells.
          example: lg_xxLA691S.tll
        format:
          type: string
          description: Internes Dateiformat erkannt.
          enum:
          - scm
          - zip
          - tll
          - sdb.xml
          - servicelist.db
          example: scm
        session_id:
          type: string
          description: Nach erfolgreicher Auswertung wird eine temporäre Sitzungskennung
            zurückgegeben. Übergeben Sie genau diesen Wert an /download.
          example: sess_01J8ABC123XYZ
        channels:
          type: array
          description: Die Kanäle wurden in ihrer aktuellen Reihenfolge analysiert.
          items:
            $ref: '#/components/schemas/Channel'
    DownloadRequest:
      type: object
      required:
      - session_id
      - channels
      properties:
        session_id:
          type: string
          description: Von /upload zurückgegebene Sitzungs-ID.
          example: sess_01J8ABC123XYZ
        channels:
          type: array
          description: Geänderte Kanalliste. Die Reihenfolge im Array bestimmt die
            Reihenfolge der Kanäle im Ergebnis.
          minItems: 1
          items:
            $ref: '#/components/schemas/Channel'
      example:
        session_id: sess_01J8ABC123XYZ
        channels:
        - false: 1
          Name: TRT 1 HD
          Type: TV
          Freq: '11958'
          Pol: V
          Sym: '27500'
          Fav: 'Yes'
          Lock: 'No'
          Encrypted: 'No'
security:
- {}
- ApiKeyAuth: []
paths:
  /upload:
    post:
      tags:
      - Channel Lists
      operationId: uploadChannelList
      summary: Eine TV-Senderliste hochladen und auswerten
      description: 'Laden Sie eine Datei mit einer unterstützten TV-Senderliste hoch.
        Der Server erkennt die TV-Marke, analysiert die Sender und erstellt eine temporäre
        Bearbeitungssitzung.


        Unterstützte Formate nach Marke:

        - Samsung: .scm, .zip

        - LG: .tll

        - Sony: sdb.xml

        - Hisense: servicelist.db

        '
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: TV channel list file (.scm, .zip, .tll, .xml, .db)
      responses:
        '200':
          description: Channel list successfully parsed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
              examples:
                samsung_upload:
                  summary: Successful Samsung Parse
                  value:
                    success: true
                    brand: samsung
                    format: scm
                    session_id: sess_01J8ABC123XYZ
                    channels:
                    - false: 1
                      Name: TRT 1 HD
                      Type: TV
                      Freq: '11958'
                      Pol: V
                      Sym: '27500'
                      Fav: 'Yes'
                      Lock: 'No'
                      Encrypted: 'No'
        '400':
          description: Invalid, unsupported, or malformed channel list file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Uploaded file is too large (Max 2MB).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded (50 per hour). Use X-API-Key to bypass.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /build:
    post:
      tags:
      - Channel Lists
      operationId: buildChannelList
      summary: Repack modified channel list
      description: 'Rebuild the channel-list file associated with a session. The returned
        JSON contains a `download_url` to fetch the binary file.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DownloadRequest'
      responses:
        '200':
          description: Rebuild successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  download_url:
                    type: string
                    example: /download/sess_123/channels.scm
        '400':
          description: Invalid request or expired session_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /download/{session_id}/{filename}:
    get:
      tags:
      - Channel Lists
      operationId: downloadBinaryFile
      summary: Download the rebuilt binary file
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
      - name: filename
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Rebuilt binary channel-list file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: File not found or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /health:
    get:
      tags:
      - System
      operationId: checkHealth
      summary: Health check endpoint
      description: Returns 200 OK if the API is running correctly. Used for UptimeRobot
        and Render Health Checks.
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
  /api/version:
    get:
      tags:
      - System
      operationId: getApiVersion
      summary: Get current API version and deployment status
      description: Returns the semantic version, latest git commit hash, and the exact
        timestamp when the server was deployed/booted. Useful for cache-busting and
        deployment verification.
      responses:
        '200':
          description: Version info
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: online
                  version:
                    type: string
                    example: 1.0.0
                  commit:
                    type: string
                    description: The active Git commit hash running on the server.
                    example: 97401a523...
                  deployed_at:
                    type: string
                    format: date-time
                    description: Timestamp of when the server application booted.
                    example: 2026-08-18 19:00:51.123456+00:00
  /api/share:
    post:
      tags:
      - Cloud Sync
      operationId: createShareCode
      summary: Create a 8-character share code
      description: Save a channel list draft to the cloud and receive a unique 8-character
        code to share with other devices.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - draft
              properties:
                draft:
                  type: object
                  description: The current channel list and session data
      responses:
        '200':
          description: Share code created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  code:
                    type: string
                    example: X8VUJP
                  message:
                    type: string
        '400':
          description: Invalid data
        '429':
          description: Rate limit exceeded (20 per minute)
  /api/share/{code}:
    get:
      tags:
      - Cloud Sync
      operationId: getSharedList
      summary: Retrieve a shared channel list
      description: Fetch a previously saved channel list using its 8-character share
        code.
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
        description: The 8-character share code
      responses:
        '200':
          description: Channel list retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
        '404':
          description: Code invalid or expired
        '429':
          description: Rate limit exceeded (20 per minute)
