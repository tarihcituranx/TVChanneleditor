openapi: 3.0.3
info:
  title: TV Channel Editor API
  version: 1.0.0
  summary: API zum Analysieren und Neuverpacken von Smart-TV-Senderlisten
  description: 'Smart-TV-Senderlisten-Dateien analysieren, prüfen, ändern und neu
    verpacken.


    Zu den unterstützten Marken gehören Samsung, LG, Sony und Hisense.

    Die API nutzt einen sitzungsbasierten Arbeitsablauf:


    1. Eine unterstützte TV-Senderlisten-Datei hochladen

    2. Die zurückgegebenen Werte `session_id`, `brand` und das Array `channels` auslesen

    3. Ändern Sie die Kanalobjekte (z. B. Reihenfolge ändern, umbenennen, als Favorit
    markieren/sperren)

    4. Senden Sie die `session_id` und das geänderte `channels`-Array an `/download`

    5. Empfangen Sie die neu erstellte binäre Kanal-Listendatei

    '
  contact:
    name: Turan KAYA (Founder & Security Contact)
    url: https://github.com/tarihcituranx/TVChanneleditor
    email: tarihcituranx@proton.me
servers:
- url: https://tvchanneleditor.onrender.com
  description: Production Server
tags:
- name: Channel Lists
  description: Kanallisten hochladen, analysieren, bearbeiten und herunterladen
components:
  schemas:
    ErrorResponse:
      type: object
      required:
        - success
        - error
        - code
      properties:
        success:
          type: boolean
          example: false
        code:
          type: string
          example: FILE_NOT_FOUND
        error:
          type: string
          example: Dosya bulunamadı
    Channel:
      type: object
      description: >
        A single TV or radio channel. Fields are returned by /upload and accepted by /build.
        Samsung/Tizen files use PascalCase fields; LG/Sony/Hisense files are normalised to the
        same schema on the server side before being returned.
      required:
        - Name
      properties:
        "No":
          type: integer
          description: >
            Logical Channel Number (display position). The array order in the channels
            list is authoritative for ordering during /build. This field is informational
            and will be recalculated during export.
          minimum: 1
          example: 1
        Slot:
          type: integer
          description: >
            Internal hardware slot index. Required by the firmware for SCM/TLL formats.
            Do not modify unless you know what you are doing.
          example: 0
        Name:
          type: string
          description: Display name of the channel shown on the TV.
          maxLength: 40
          example: TRT 1 HD
        Type:
          type: string
          description: "Channel type: HD, SD, Radio, Data or empty."
          enum: [TV, HD, SD, Radio, Data, ""]
          example: HD
        Freq:
          type: string
          description: Satellite/transponder frequency in MHz.
          example: "11958"
        Pol:
          type: string
          description: Satellite polarization.
          enum: [V, H, ""]
          example: V
        Sym:
          type: string
          description: Symbol rate in ksps.
          example: "27500"
        Mod:
          type: string
          description: Modulation type (e.g. DVB-S2, 8PSK, QPSK). Present on Samsung SCM files.
          example: DVB-S2
        RollOff:
          type: string
          description: Roll-off factor. Present on Samsung SCM files.
          example: "0.35"
        Lock:
          type: boolean
          description: Whether the channel is PIN-locked.
          example: false
        Hide:
          type: boolean
          description: Whether the channel is hidden from the channel list on the TV.
          example: false
        Skip:
          type: boolean
          description: Whether the channel is skipped during up/down channel surfing.
          example: false
        Encrypted:
          type: string
          description: Whether the channel is encrypted (Pay TV / conditional access).
          enum: ["Yes", "No"]
          example: "No"
        Fav1:
          type: boolean
          description: Favourite list 1 membership.
          example: false
        Fav2:
          type: boolean
          description: Favourite list 2 membership.
          example: false
        Fav3:
          type: boolean
          description: Favourite list 3 membership.
          example: false
        Fav4:
          type: boolean
          description: Favourite list 4 membership.
          example: false
        Fav5:
          type: boolean
          description: Favourite list 5 membership.
          example: false
        SID:
          type: integer
          description: Service ID (DVB). Present in LG, Sony, Hisense files.
          example: 8280
        TSID:
          type: integer
          description: Transport Stream ID (DVB). Present in LG, Sony, Hisense files.
          example: 1071
        ONID:
          type: integer
          description: Original Network ID (DVB). Present in LG, Sony, Hisense files.
          example: 1
        VidPID:
          type: integer
          description: Video Elementary Stream PID. Present in Samsung SCM files.
          example: 1221
        AudPID:
          type: string
          description: Audio Elementary Stream PID(s). May be a single integer or a comma-separated list.
          example: "1222,1223"
        PcrPID:
          type: integer
          description: Program Clock Reference PID. Present in Samsung SCM files.
          example: 1221
    UploadResponse:
      type: object
      required:
      - success
      - brand
      - format
      - session_id
      - channels
      properties:
        success:
          type: boolean
          example: true
        brand:
          type: string
          description: Erkannte TV-Marke.
          enum:
          - samsung
          - lg
          - sony
          - hisense
          - unknown
          example: samsung
        original_filename:
          type: string
          description: Der Name der ursprünglich hochgeladenen Datei; hilfreich zur
            Identifizierung des TV-Modells.
          example: lg_xxLA691S.tll
        format:
          type: string
          description: Internes Dateiformat erkannt.
          enum:
          - scm
          - zip
          - tll
          - sdb.xml
          - servicelist.db
          example: scm
        session_id:
          type: string
          description: Nach erfolgreicher Auswertung wird eine temporäre Sitzungskennung
            zurückgegeben. Übergeben Sie genau diesen Wert an /download.
          example: sess_01J8ABC123XYZ
        channels:
          type: array
          description: Die Kanäle wurden in ihrer aktuellen Reihenfolge analysiert.
          items:
            $ref: '#/components/schemas/Channel'
    DownloadRequest:
      type: object
      required:
      - session_id
      - channels
      properties:
        session_id:
          type: string
          description: Von /upload zurückgegebene Sitzungs-ID.
          example: sess_01J8ABC123XYZ
        channels:
          type: array
          description: Geänderte Kanalliste. Die Reihenfolge im Array bestimmt die
            Reihenfolge der Kanäle im Ergebnis.
          minItems: 1
          items:
            $ref: '#/components/schemas/Channel'
      example:
        session_id: sess_01J8ABC123XYZ
        channels:
        - false: 1
          No: 1

          Slot: 0

          Name: TRT 1 HD

          Type: TV

          Freq: '11958'

          Pol: V

          Sym: '27500'

          Lock: false

          Hide: false

          Skip: false

          Encrypted: 'No'

          Fav1: false

          Fav2: false

          Fav3: false

          Fav4: false

          Fav5: false
security:
- {}
- ApiKeyAuth: []
paths:
  /upload:
    post:
      tags:
      - Channel Lists
      operationId: uploadChannelList
      summary: Eine TV-Senderliste hochladen und auswerten
      description: 'Laden Sie eine Datei mit einer unterstützten TV-Senderliste hoch.
        Der Server erkennt die TV-Marke, analysiert die Sender und erstellt eine temporäre
        Bearbeitungssitzung.


        Unterstützte Formate nach Marke:

        - Samsung: .scm, .zip

        - LG: .tll

        - Sony: sdb.xml

        - Hisense: servicelist.db

        '
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: TV channel list file (.scm, .zip, .tll, .xml, .db)
      responses:
        '200':
          description: Channel list successfully parsed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
              examples:
                samsung_upload:
                  summary: Successful Samsung Parse
                  value:
                    success: true
                    brand: samsung
                    format: scm
                    session_id: sess_01J8ABC123XYZ
                    channels:
                    - false: 1
                      No: 1

                      Slot: 0

                      Name: TRT 1 HD

                      Type: TV

                      Freq: '11958'

                      Pol: V

                      Sym: '27500'

                      Lock: false

                      Hide: false

                      Skip: false

                      Encrypted: 'No'

                      Fav1: false

                      Fav2: false

                      Fav3: false

                      Fav4: false

                      Fav5: false
        '400':
          description: Invalid, unsupported, or malformed channel list file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Uploaded file is too large (Max 2MB).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded (50 per hour)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /build:
    post:
      tags:
      - Channel Lists
      operationId: buildChannelList
      summary: Repack modified channel list
      description: 'Rebuild the channel-list file associated with a session. The returned
        JSON contains a `download_url` to fetch the binary file.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DownloadRequest'
      responses:
        '200':
          description: Rebuild successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  download_url:
                    type: string
                    example: /download/sess_123/channels.scm
        '400':
          description: Invalid request or expired session_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /download/{session_id}/{filename}:
    get:
      tags:
      - Channel Lists
      operationId: downloadBinaryFile
      summary: Download the rebuilt binary file
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
      - name: filename
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Rebuilt binary channel-list file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: File not found or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /health:
    get:
      tags:
      - System
      operationId: checkHealth
      summary: Health check endpoint
      description: Returns 200 OK if the API is running correctly. Used for UptimeRobot
        and Render Health Checks.
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
  /api/version:
    get:
      tags:
      - System
      operationId: getApiVersion
      summary: Get current API version and deployment status
      description: Returns the semantic version, latest git commit hash, and the exact
        timestamp when the server was deployed/booted. Useful for cache-busting and
        deployment verification.
      responses:
        '200':
          description: Version info
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: online
                  version:
                    type: string
                    example: 1.0.0
                  commit:
                    type: string
                    description: The active Git commit hash running on the server.
                    example: 97401a523...
                  deployed_at:
                    type: string
                    format: date-time
                    description: Timestamp of when the server application booted.
                    example: 2026-08-18 19:00:51.123456+00:00

  /api/actions/delete-radios:
    post:
      tags:
      - Tools & Actions
      operationId: actionDeleteRadios
      summary: Remove all radio channels
      description: Returns the channel list with all radio (audio) channels removed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channels]
              properties:
                channels:
                  type: array
                  items:
                    $ref: '#/components/schemas/Channel'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  deleted:
                    type: integer
                  channels:
                    type: array
                    items:
                      $ref: '#/components/schemas/Channel'
  /api/actions/delete-encrypted:
    post:
      tags:
      - Tools & Actions
      operationId: actionDeleteEncrypted
      summary: Remove all encrypted channels
      description: Returns the channel list with all encrypted (Pay TV) channels removed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channels]
              properties:
                channels:
                  type: array
                  items:
                    $ref: '#/components/schemas/Channel'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  deleted:
                    type: integer
                  channels:
                    type: array
                    items:
                      $ref: '#/components/schemas/Channel'
  /api/actions/uppercase:
    post:
      tags:
      - Tools & Actions
      operationId: actionUppercase
      summary: Uppercase all channel names
      description: Returns the channel list with all channel names converted to UPPERCASE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channels]
              properties:
                channels:
                  type: array
                  items:
                    $ref: '#/components/schemas/Channel'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  channels:
                    type: array
                    items:
                      $ref: '#/components/schemas/Channel'
  /api/actions/sort-az:
    post:
      tags:
      - Tools & Actions
      operationId: actionSortAZ
      summary: Sort channels A-Z
      description: Returns the channel list alphabetically sorted by channel name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channels]
              properties:
                channels:
                  type: array
                  items:
                    $ref: '#/components/schemas/Channel'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  channels:
                    type: array
                    items:
                      $ref: '#/components/schemas/Channel'
  /api/actions/apply-template:
    post:
      tags:
      - Tools & Actions
      operationId: actionApplyTemplate
      summary: Apply a Smart Template
      description: Reorders the channels based on a predefined smart template (e.g. 'general', 'news', 'sports', 'movies', 'music', 'documentary', 'kids'). Unmatched channels are appended to the end.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channels, template]
              properties:
                template:
                  type: string
                  example: general
                  description: "Template ID (e.g., general, news, sports)"
                channels:
                  type: array
                  items:
                    $ref: '#/components/schemas/Channel'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  template_applied:
                    type: string
                  channels:
                    type: array
                    items:
                      $ref: '#/components/schemas/Channel'

  /api/share:
    post:
      tags:
      - Cloud Sync
      operationId: createShareCode
      summary: Create a 8-character share code
      description: Save a channel list draft to the cloud and receive a unique 8-character
        code to share with other devices.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - draft
              properties:
                draft:
                  type: object
                  description: The current channel list and session data
      responses:
        '200':
          description: Share code created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  code:
                    type: string
                    example: X8VUJP
                  message:
                    type: string
        '400':
          description: Invalid data
        '429':
          description: Rate limit exceeded (20 per minute)
  /api/share/{code}:
    get:
      tags:
      - Cloud Sync
      operationId: getSharedList
      summary: Retrieve a shared channel list
      description: Fetch a previously saved channel list using its 8-character share
        code.
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
        description: The 8-character share code
      responses:
        '200':
          description: Channel list retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
        '404':
          description: Code invalid or expired
        '429':
          description: Rate limit exceeded (20 per minute)
